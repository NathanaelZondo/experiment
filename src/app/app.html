<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="app-header">
  <div class="app-header-left">
    <button type="button" class="header-toggle" aria-label="Toggle conversation list" [attr.aria-expanded]="sidebarOpen ? true : null" (click)="toggleSidebar()">
      <app-icon name="menu" [size]="20"></app-icon>
    </button>
    <span class="app-brand">Experiment</span>
  </div>

  <div class="app-header-right">
    <button type="button" class="header-toggle" aria-label="Toggle dark mode" (click)="themeService.toggle()">
      @if (themeService.theme() === 'dark') {
        <app-icon name="sun" [size]="20"></app-icon>
      } @else {
        <app-icon name="moon" [size]="20"></app-icon>
      }
    </button>
    <button type="button" class="header-toggle" aria-label="Toggle settings panel" [attr.aria-expanded]="settingsOpen ? true : null" (click)="toggleSettings()">
      <app-icon name="sliders" [size]="20"></app-icon>
    </button>
  </div>
</header>

<div class="shell" [class.has-sidebar]="sidebarOpen" [class.has-settings]="settingsOpen">
  @if (sidebarOpen) {
    <div class="drawer-backdrop" aria-hidden="true" (click)="toggleSidebar()"></div>
  }
  @if (settingsOpen) {
    <div class="drawer-backdrop drawer-backdrop--settings" aria-hidden="true" (click)="toggleSettings()"></div>
  }

  <nav class="panel panel--sidebar" [class.is-open]="sidebarOpen" aria-label="Conversations">
    <app-sidebar (deleteRequest)="onRequestDelete($event)"></app-sidebar>
  </nav>

  <main id="main-content" class="panel panel--chat" tabindex="-1">
    <app-chat-panel></app-chat-panel>
  </main>

  <aside class="panel panel--settings" [class.is-open]="settingsOpen" aria-label="Settings">
    <app-settings-panel (close)="toggleSettings()"></app-settings-panel>
  </aside>
</div>

<app-dialog [open]="pendingDeleteId !== null" title="Delete conversation?" (close)="cancelDelete()">
  <p>
    “{{ pendingConversationTitle }}” has messages. Deleting it cannot be undone — and since this is a
    session-only app, nothing survives a refresh anyway.
  </p>
  <div class="dialog-actions">
    <app-button variant="secondary" (click)="cancelDelete()">Cancel</app-button>
    <app-button variant="danger" (click)="confirmDelete()">Delete</app-button>
  </div>
</app-dialog>

<router-outlet />
