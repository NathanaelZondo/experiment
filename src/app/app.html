<a class="skip-link" href="#main-chat">Skip to conversation</a>

<header class="topbar">
  <div class="topbar__left">
    <button
      type="button"
      class="drawer-toggle"
      aria-label="Toggle conversations panel"
      [attr.aria-expanded]="leftOpen()"
      (click)="leftOpen.set(!leftOpen()); rightOpen.set(false)"
    >
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M2.75 3a.75.75 0 0 0 0 1.5h10.5a.75.75 0 0 0 0-1.5H2.75Zm0 4.25a.75.75 0 0 0 0 1.5h10.5a.75.75 0 0 0 0-1.5H2.75Zm0 4.25a.75.75 0 0 0 0 1.5h10.5a.75.75 0 0 0 0-1.5H2.75Z" />
      </svg>
    </button>
    <span class="topbar__brand">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M12 3v3m0 12v3M3 12h3m12 0h3" stroke-linecap="round" />
        <rect x="7" y="7" width="10" height="10" rx="2.5" />
      </svg>
      LocalBench&nbsp;Chat
    </span>
  </div>

  <div class="topbar__right">
    <app-status-badge [state]="statusState" />
    <app-tooltip text="Toggle theme (held in memory only)">
      <app-icon-button label="Toggle colour theme" (click)="toggleTheme()">
        @if (theme() === 'dark') {
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-10.25A.75.75 0 0 1 8.75 2.5v1A.75.75 0 0 1 7.25 3.5v-1a.75.75 0 0 1 .75-.75Zm0 11.5a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-1.5 0v-1a.75.75 0 0 1 .75-.75Zm6.5-6.25a.75.75 0 0 1-.75.75h-1a.75.75 0 0 1 0-1.5h1a.75.75 0 0 1 .75.75ZM3.25 8a.75.75 0 0 1-.75.75h-1a.75.75 0 0 1 0-1.5h1A.75.75 0 0 1 3.25 8ZM13.4 4.6a.75.75 0 0 1 0 1.06l-.7.7a.75.75 0 1 1-1.06-1.06l.7-.7a.75.75 0 0 1 1.06 0ZM4.36 11.64a.75.75 0 0 1 0 1.06l-.7.7a.75.75 0 0 1-1.06-1.06l.7-.7a.75.75 0 0 1 1.06 0Zm9.04 1.76a.75.75 0 0 1-1.06 0l-.7-.7a.75.75 0 0 1 1.06-1.06l.7.7a.75.75 0 0 1 0 1.06ZM4.36 4.36a.75.75 0 0 1-1.06 0l-.7-.7A.75.75 0 0 1 3.66 2.6l.7.7a.75.75 0 0 1 0 1.06Z" />
          </svg>
        } @else {
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M9.35 2.14a.75.75 0 0 1 .84.98A5.5 5.5 0 0 0 4.88 11.49a.75.75 0 0 1-.98-.84 7 7 0 0 1 5.45-8.51Z" />
          </svg>
        }
      </app-icon-button>
    </app-tooltip>
    <button
      type="button"
      class="drawer-toggle drawer-toggle--right"
      aria-label="Toggle model panel"
      [attr.aria-expanded]="rightOpen()"
      (click)="rightOpen.set(!rightOpen()); leftOpen.set(false)"
    >
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M8 2a5.75 5.75 0 0 0-5.75 5.75h1.5A4.25 4.25 0 0 1 8 3.5a4.25 4.25 0 0 1 4.25 4.25h1.5A5.75 5.75 0 0 0 8 2Zm-6.5 6.5A6.5 6.5 0 0 0 8 15a6.5 6.5 0 0 0 6.5-6.5h-1.5A5 5 0 0 1 8 13.5 5 5 0 0 1 3 8.5H1.5Z" />
      </svg>
    </button>
  </div>
</header>

<div class="panels">
  @if (leftOpen()) {
    <div class="drawer-backdrop" aria-hidden="true" (click)="closeDrawers()"></div>
  } @else if (rightOpen()) {
    <div class="drawer-backdrop" aria-hidden="true" (click)="closeDrawers()"></div>
  }

  <nav
    class="panel panel--left"
    [class.panel--open]="leftOpen()"
    aria-label="Conversations"
  >
    <app-conversation-sidebar (selected)="leftOpen.set(false)" />
  </nav>

  <main id="main-chat" class="panel panel--center" aria-label="Conversation">
    <app-chat-panel />
  </main>

  <aside class="panel panel--right" [class.panel--open]="rightOpen()" aria-label="Model, settings and metrics">
    <app-model-pane />
  </aside>
</div>
