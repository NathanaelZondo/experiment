<section class="settings" aria-label="Generation settings">
  <div class="settings__head">
    <h2 class="pane__title">Generation settings</h2>
    <app-button variant="ghost" size="sm" [disabled]="!isDirty()" (click)="resetToDefaults()">Reset to defaults</app-button>
  </div>

  <div class="settings__grid mono">
    <label class="field">
      <span class="field__label">Temperature <small>(0–2)</small></span>
      <input type="number" step="0.1" min="0" max="2" [ngModel]="temperatureValue()" (ngModelChange)="updateField('temperature', $event)" [class.field__control--invalid]="errors().temperature !== undefined" />
      @if (errors().temperature) { <span class="field__error" role="alert">{{ errors().temperature }}</span> }
    </label>

    <label class="field">
      <span class="field__label">Top-p <small>(0–1)</small></span>
      <input type="number" step="0.05" min="0" max="1" [ngModel]="topPValue()" (ngModelChange)="updateField('topP', $event)" [class.field__control--invalid]="errors().topP !== undefined" />
      @if (errors().topP) { <span class="field__error" role="alert">{{ errors().topP }}</span> }
    </label>

    <label class="field">
      <span class="field__label">Top-k <small>(0–100)</small></span>
      <input type="number" step="1" min="0" max="100" [ngModel]="topKValue()" (ngModelChange)="updateField('topK', $event)" [class.field__control--invalid]="errors().topK !== undefined" />
      @if (errors().topK) { <span class="field__error" role="alert">{{ errors().topK }}</span> }
    </label>

    <label class="field">
      <span class="field__label">Repeat penalty <small>(0.5–2)</small></span>
      <input type="number" step="0.05" min="0.5" max="2" [ngModel]="repeatPenaltyValue()" (ngModelChange)="updateField('repeatPenalty', $event)" [class.field__control--invalid]="errors().repeatPenalty !== undefined" />
      @if (errors().repeatPenalty) { <span class="field__error" role="alert">{{ errors().repeatPenalty }}</span> }
    </label>

    <label class="field">
      <span class="field__label">Max output tokens <small>(1–32768)</small></span>
      <input type="number" step="1" min="1" max="32768" [ngModel]="maxOutputTokensValue()" (ngModelChange)="updateField('maxOutputTokens', $event)" [class.field__control--invalid]="errors().maxOutputTokens !== undefined" />
      @if (errors().maxOutputTokens) { <span class="field__error" role="alert">{{ errors().maxOutputTokens }}</span> }
    </label>

    <label class="field">
      <span class="field__label">Reasoning mode</span>
      <select [ngModel]="settingsSignal().reasoningMode" (ngModelChange)="onReasoningChange($event)">
        <option value="auto">Auto</option>
        <option value="enabled">Enabled</option>
        <option value="disabled">Disabled</option>
      </select>
      <small class="field__hint">Reasoning models may still think briefly even with “Disabled”.</small>
    </label>
  </div>
</section>
