<!-- Skip link - jumps to main content -->
<a href="#main-content" class="skip-link" aria-label="Skip to main content">
  Skip to content
</a>

<main class="shell-main" id="main-content" role="main">
  <!-- Three-panel layout -->
  <div class="shell-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" role="navigation" aria-label="Main navigation">
      <nav class="nav-menu">
        @for (item of navItems; track item.id) {
          <a
            [routerLink]="item.link"
            routerLinkActive="active"
            class="nav-link"
            [class.active]="isRoute(item.link)"
            [attr.aria-current]="isRoute(item.link) ? 'page' : undefined"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>

    <!-- Right Panel / Actions -->
    <aside
      class="actions-panel"
      role="complementary"
      aria-label="Action controls"
    >
      @for (action of actionItems; track action.id) {
        <button
          class="action-btn"
          (click)="action.action"
          [class.active]="action.active"
        >
          {{ action.label }}
        </button>
      }
    </aside>
  </div>
</main>

<!-- Footer -->
<footer class="app-footer" role="contentinfo">
  <small>Experiment App • Built with Angular</small>
</footer>
