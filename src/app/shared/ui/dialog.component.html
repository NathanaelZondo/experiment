@if (open()) {
  <div class="lb-dialog__backdrop" (click)="close()">
    <div
      #panel
      class="lb-dialog"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      tabindex="-1"
      (keydown.escape)="close()"
      (click)="$event.stopPropagation()"
    >
      <header class="lb-dialog__header">
        <h2 class="lb-dialog__title">{{ title() }}</h2>
        <button type="button" class="lb-dialog__close" aria-label="Close dialog" (click)="close()">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
            <path d="M3.72 2.34a.75.75 0 0 0-1.06 1.06L6.94 8l-4.28 4.6a.75.75 0 1 0 1.1 1.04L8 9.06l4.24 4.58a.75.75 0 1 0 1.1-1.04L9.06 8l4.28-4.6a.75.75 0 1 0-1.06-1.06L8 6.94 3.72 2.34Z" />
          </svg>
        </button>
      </header>
      <div class="lb-dialog__body">
        <ng-content select="[dialogBody]" />
      </div>
      <footer class="lb-dialog__footer">
        <ng-content select="[dialogFooter]" />
      </footer>
    </div>
  </div>
}
